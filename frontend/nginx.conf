# nginx server block for the built React SPA.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files, falling back to index.html so the SPA loads on any path
  # instead of returning 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
